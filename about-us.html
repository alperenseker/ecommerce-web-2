<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>О компании — FORES</title>
    <meta name="description" content="FORES — производитель оконной и дверной фурнитуры в Казахстане.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body data-page="content" data-title-i18n="meta.about">

<div id="site-header"></div>

<main class="container">

    <nav class="crumbs" aria-label="breadcrumb">
        <a href="index.html" data-i18n="about.breadcrumb.home">Главная</a>
        <span class="crumbs__sep">/</span>
        <span class="crumbs__current" data-i18n="about.breadcrumb.aboutUs">О нас</span>
        </nav>

    <div class="page-head">
        <h1 data-i18n="about.pageTitle">О компании</h1>
    </div>

    <section class="card mb-4"><div class="card__body t-center">
        <h2 data-i18n="about.intro.title"></h2>
        <p class="t-mut" data-i18n="about.intro.description"></p>
        <figure class="about-figure mt-4" style="margin:16px 0 0">
            <img src="assets/img/about/about-us1.webp" alt="FORES" width="1240" height="540" loading="lazy">
        </figure>
    </div></section>

    <section class="card mb-4"><div class="card__body">
        <div class="about-split">
            <figure class="about-figure" style="margin:0">
                <img src="assets/img/about/about-us2.webp" alt="FORES" width="610" height="500" loading="lazy">
            </figure>
            <div>
                <h2 data-i18n="about.fullCycle.title"></h2>
                <div class="fc-block">
                    <h4>
                        <i class="ico"><svg viewBox="0 0 24 24"><path d="M2 20h20M4 20V9l6 4V9l6 4V6h4v14M8 20v-4h4v4"/></svg></i>
                        <span data-i18n="about.fullCycle.leadTitle"></span>
                    </h4>
                    <p class="t-mut" data-i18n="about.fullCycle.leadText"></p>
                </div>
                <div class="fc-block">
                    <h4>
                        <i class="ico"><svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10ZM2 21c0-3 1.9-5.7 4.5-7.5"/></svg></i>
                        <span data-i18n="about.fullCycle.ecoTitle"></span>
                    </h4>
                    <p class="t-mut" data-i18n="about.fullCycle.ecoText"></p>
                </div>
            </div>
        </div>
    </div></section>

    <section class="count-grid mb-4">
        <div class="count-box">
            <div class="count-box__num">75%</div>
            <h4 data-i18n="about.stats.inHouse.title"></h4>
            <p data-i18n="about.stats.inHouse.description"></p>
        </div>
        <div class="count-box">
            <div class="count-box__num"><span data-i18n="about.stats.years.since">С</span> 2016</div>
            <h4 data-i18n="about.stats.years.title"></h4>
            <p data-i18n="about.stats.years.description"></p>
        </div>
        <div class="count-box">
            <div class="count-box__num">5 <span data-i18n="about.stats.workshops.label" style="font-size:16px"></span></div>
            <h4 data-i18n="about.stats.workshops.title"></h4>
            <p data-i18n="about.stats.workshops.description"></p>
        </div>
    </section>

    <section class="card mb-4"><div class="card__body">
        <h2 class="t-center" data-i18n="about.products.title"></h2>
        <p class="t-center t-mut" data-i18n="about.products.subtitle"></p>
        <div class="plist mt-4">
            <div class="plist__item"><i class="ico"><svg viewBox="0 0 24 24"><path d="m21 16-9 5-9-5V8l9-5 9 5v8ZM3.3 7.5 12 12.5l8.7-5M12 22v-9.5"/></svg></i><span data-i18n="about.products.item1"></span></div>
            <div class="plist__item"><i class="ico"><svg viewBox="0 0 24 24"><path d="m21 16-9 5-9-5V8l9-5 9 5v8ZM3.3 7.5 12 12.5l8.7-5M12 22v-9.5"/></svg></i><span data-i18n="about.products.item2"></span></div>
            <div class="plist__item"><i class="ico"><svg viewBox="0 0 24 24"><path d="m21 16-9 5-9-5V8l9-5 9 5v8ZM3.3 7.5 12 12.5l8.7-5M12 22v-9.5"/></svg></i><span data-i18n="about.products.item3"></span></div>
            <div class="plist__item"><i class="ico"><svg viewBox="0 0 24 24"><path d="m21 16-9 5-9-5V8l9-5 9 5v8ZM3.3 7.5 12 12.5l8.7-5M12 22v-9.5"/></svg></i><span data-i18n="about.products.item4"></span></div>
            <div class="plist__item"><i class="ico"><svg viewBox="0 0 24 24"><path d="m21 16-9 5-9-5V8l9-5 9 5v8ZM3.3 7.5 12 12.5l8.7-5M12 22v-9.5"/></svg></i><span data-i18n="about.products.item5"></span></div>
            <div class="plist__item"><i class="ico"><svg viewBox="0 0 24 24"><path d="m21 16-9 5-9-5V8l9-5 9 5v8ZM3.3 7.5 12 12.5l8.7-5M12 22v-9.5"/></svg></i><span data-i18n="about.products.item6"></span></div>
            <div class="plist__item"><i class="ico"><svg viewBox="0 0 24 24"><path d="m21 16-9 5-9-5V8l9-5 9 5v8ZM3.3 7.5 12 12.5l8.7-5M12 22v-9.5"/></svg></i><span data-i18n="about.products.item7"></span></div>
            <div class="plist__item"><i class="ico"><svg viewBox="0 0 24 24"><path d="m21 16-9 5-9-5V8l9-5 9 5v8ZM3.3 7.5 12 12.5l8.7-5M12 22v-9.5"/></svg></i><span data-i18n="about.products.item8"></span></div>
        </div>
        <p class="t-center t-mut mt-4 mb-0" data-i18n="about.products.note"></p>
    </div></section>

    <section class="card mb-4"><div class="card__body">
        <h2 class="t-center" data-i18n="about.export.title"></h2>
        <p class="t-center t-mut" data-i18n="about.export.description"></p>
        <div class="grid grid--2 gap-4 mt-4">
            <div class="stat-box">
                <h3 data-i18n="about.export.homeTitle"></h3>
                <span class="badge badge--acc" data-i18n="about.export.homeLabel"></span>
            </div>
            <div class="stat-box">
                <p class="t-bold" data-i18n="about.export.exportTitle"></p>
                <div class="flex wrap gap-2">
                    <span class="badge" data-i18n="about.export.country1"></span>
                    <span class="badge" data-i18n="about.export.country2"></span>
                    <span class="badge" data-i18n="about.export.country3"></span>
                    <span class="badge" data-i18n="about.export.country4"></span>
                </div>
            </div>
        </div>
    </div></section>

    <section class="card mb-4"><div class="card__body">
        <h2 data-i18n="about.imports.title"></h2>
        <p class="t-mut" data-i18n="about.imports.description"></p>
        <div class="about-split mt-4">
            <div>
                <h4 data-i18n="about.quality.title"></h4>
                <p class="t-mut" data-i18n="about.quality.description"></p>
                <a class="btn btn--ghost btn--sm" href="contact-us.html" data-i18n="about.quality.button"></a>
            </div>
            <figure class="about-figure" style="margin:0">
                <img src="assets/img/about/about-us3.webp" alt="FORES" width="610" height="420" loading="lazy">
            </figure>
        </div>
    </div></section>

    <section class="card mb-4"><div class="card__body">
        <h4 data-i18n="about.workshops.sectionTitle"></h4>
        <div class="plist mt-3">
            <div class="plist__item"><span data-i18n="about.workshops.foundry"></span></div>
            <div class="plist__item"><span data-i18n="about.workshops.stamping"></span></div>
            <div class="plist__item"><span data-i18n="about.workshops.painting"></span></div>
            <div class="plist__item"><span data-i18n="about.workshops.coating"></span></div>
        </div>
    </div></section>

    <section class="card"><div class="card__body t-center">
        <h2 data-i18n="about.mission.title"></h2>
        <p class="t-mut" data-i18n="about.mission.description"></p>
        <h3 class="mt-4" data-i18n="about.mission.closingTitle"></h3>
        <p class="t-mut" data-i18n="about.mission.closingText"></p>
        <a class="btn btn--primary" href="shop.html" data-i18n="about.mission.button"></a>
    </div></section>

</main>

<div id="site-footer"></div>

<script src="assets/js/loader.js"></script>
</body>
</html>

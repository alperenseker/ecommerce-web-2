<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Корзина — NOVATECH</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body data-page="cart">

<div id="site-header"></div>

<main class="container">

    <nav class="crumbs" aria-label="breadcrumb">
        <a href="index.html" data-i18n="common.home">Главная</a>
        <span class="crumbs__sep">/</span>
        <span class="crumbs__current" data-i18n="cart.title">Корзина</span>
    </nav>

    <div class="flex items-c justify-b wrap gap-4 mb-6">
        <h1 data-i18n="cart.title">Корзина</h1>
        <div class="steps">
            <span class="step is-active"><span class="step__num">1</span>
                <span class="step__label" data-i18n="checkout.steps.cart">Корзина</span></span>
            <span class="step__bar"></span>
            <span class="step"><span class="step__num">2</span>
                <span class="step__label" data-i18n="checkout.steps.checkout">Оформление</span></span>
            <span class="step__bar"></span>
            <span class="step"><span class="step__num">3</span>
                <span class="step__label" data-i18n="checkout.steps.done">Готово</span></span>
        </div>
    </div>

    <div id="cart-root"></div>

</main>

<div id="site-footer"></div>

<script src="assets/js/loader.js"></script>
</body>
</html>
